name: TAMPslat DevSecOps

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  validate:
    name: Application validation and security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Worker and browser engines
        run: |
          node --check backend/worker.js
          node --check backend/billing.js
          node --check backend-client.js
          node --check tool-usage.js
          node --check workspace-orchestrator.js
          node --check site-locale.js
          node --check pricing-language.js
          node --check support-translations.js
          node --check workspace-i18n.js
          node --check auth-language.js
          node --check auth-google.js
          node --check auth-confirmed.js
          node --check promo-banner.js
          node --check engines/ai-refinement-client.js
          node --check engines/studio-design-engine.js
          node --check engines/document-preview.js
          node --check app.js
          node --check landing.js
          node --check plans-data.js

      - name: Validate inline scripts in key UI pages
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const files = [
            'index.html', 'pricing.html', 'support.html', 'template-library.html', 'blog/index.html', 'login.html',
            'signup.html', 'tools.html', 'document-studio.html', 'business-operations-studio.html', 'zip-studio.html',
            'file-studio.html', 'pdf-studio.html', 'document-converter.html', 'vault-studio.html', 'spreadsheet-studio.html',
            'batch-studio.html', 'design-studio.html', 'presentation-studio.html', 'font-studio.html', '3d-web-studio.html',
            'ebook-studio.html', 'ai-studio.html', 'admin.html', 'settings.html'
          ];
          for (const file of files) {
            const html = fs.readFileSync(file, 'utf8');
            const pattern = /<script\b([^>]*)>([\s\S]*?)<\/script>/gi;
            let match;
            let number = 0;
            while ((match = pattern.exec(html))) {
              const attrs = match[1] || '';
              if (/\bsrc\s*=/.test(attrs)) continue;
              const type = (attrs.match(/\btype\s*=\s*["']?([^"'\s>]+)/i) || [])[1] || 'text/javascript';
              if (!['text/javascript', 'application/javascript'].includes(type.toLowerCase())) continue;
              new vm.Script(match[2], { filename: file + ' inline script ' + (++number) });
            }
          }
          NODE


      - name: Validate single-Worker routing and promotional strip
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const worker = fs.readFileSync('backend/worker.js', 'utf8');
          const wrangler = fs.readFileSync('wrangler.toml', 'utf8');
          const client = fs.readFileSync('backend-client.js', 'utf8');
          const promo = fs.readFileSync('promo-banner.js', 'utf8');
          if (!wrangler.includes("name = 'tampslat'") || !wrangler.includes('run_worker_first = ["/*"]')) throw new Error('All site and API requests must pass through the main tampslat Worker');
          if (!/\bbinding\s*=\s*["']ASSETS["']/.test(wrangler)) throw new Error('Main Worker must declare the ASSETS binding used by env.ASSETS.fetch(req)');
          if (!worker.includes('env.ASSETS.fetch(req)') || !worker.includes('/promo-banner.js')) throw new Error('Main Worker must serve static assets and inject the promo strip');
          if (!worker.includes('/api/ads/active') || !worker.includes('/api/admin/ads') || !worker.includes("['pro','business'].includes(user.plan)")) throw new Error('Admin ad management and Pro/Business ad preferences must be server-enforced');
          if (!promo.includes('/api/ads/active') || promo.includes('window.TAMPSLAT_PROMOS')) throw new Error('Promotional strip must load admin-managed campaigns');
          if (!fs.readFileSync('backend/migrations/0007_advertising.sql','utf8').includes('ad_preferences')) throw new Error('Advertising preference migration is missing');
          if (!fs.readFileSync('admin.html','utf8').includes('1200 × 160 px') || !fs.readFileSync('admin.html','utf8').includes('createAdminAd')) throw new Error('Admin advert uploader must show image dimensions and support uploads');
          if (!fs.readFileSync('settings.html','utf8').includes('setAdsPreference')) throw new Error('Plan-based advert preferences must be available in settings');
          if (client.includes('tampslat-api')) throw new Error('Frontend must not depend on the retired API Worker');
          if (!promo.includes('Sponsored promotions') || promo.includes('target_url') || promo.includes("createElement('a')")) throw new Error('Admin-managed advert strip must be a display-only, non-clickable image banner');
          NODE

      - name: Validate D1 migration chain
        run: |
          set -euo pipefail
          DB_FILE=/tmp/tampslat-migrations.sqlite
          sqlite3 "$DB_FILE" < backend/migrations/0001_init.sql
          for migration in backend/migrations/*.sql; do
            if [ "$migration" = "backend/migrations/0001_init.sql" ]; then continue; fi
            sqlite3 "$DB_FILE" < "$migration"
          done
          sqlite3 "$DB_FILE" "SELECT name FROM sqlite_master WHERE type='table' AND name='tool_usage_counters';" | grep -qx 'tool_usage_counters'
          sqlite3 "$DB_FILE" "SELECT name FROM sqlite_master WHERE type='table' AND name='tool_usage_reservations';" | grep -qx 'tool_usage_reservations'
          sqlite3 "$DB_FILE" "SELECT name FROM sqlite_master WHERE type='table' AND name='ad_campaigns';" | grep -qx 'ad_campaigns'
          sqlite3 "$DB_FILE" "SELECT name FROM sqlite_master WHERE type='table' AND name='ad_preferences';" | grep -qx 'ad_preferences'

      - name: Validate studio usage instrumentation
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const studios = [
            'document-studio.html', 'business-operations-studio.html', 'template-library.html',
            'document-converter.html', 'pdf-studio.html', 'zip-studio.html', 'file-studio.html',
            'vault-studio.html', 'spreadsheet-studio.html', 'batch-studio.html', 'design-studio.html',
            'presentation-studio.html', 'font-studio.html', '3d-web-studio.html', 'ebook-studio.html',
            'ai-studio.html'
          ];
          const allowed = new Set([
            'document-studio', 'business-operations-studio', 'template-library', 'document-converter',
            'pdf-studio', 'zip-studio', 'file-studio', 'vault-studio', 'spreadsheet-studio',
            'batch-studio', 'design-studio', 'presentation-studio', 'font-studio', '3d-web-studio',
            'ebook-studio', 'ai-studio'
          ]);
          for (const file of studios) {
            const html = fs.readFileSync(file, 'utf8');
            const guard = html.indexOf('<script src="tool-usage.js">');
            const firstInline = html.search(/<script\b(?![^>]*\bsrc=)[^>]*>/i);
            if (guard < 0 || (firstInline >= 0 && guard > firstInline)) {
              throw new Error(file + ': usage guard must load before inline operation handlers');
            }
            for (const match of html.matchAll(/data-metered-tool=["']([^"']+)["']/g)) {
              if (!allowed.has(match[1])) throw new Error(file + ': unknown metered tool ' + match[1]);
            }
          }
          NODE

      - name: Validate display currencies, regional checkout and email OTP
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const currencies = ['NGN', 'USD', 'GBP', 'EUR', 'CAD'];
          for (const file of ['index.html', 'pricing.html']) {
            const html = fs.readFileSync(file, 'utf8');
            for (const currency of currencies) {
              if (!html.includes('value="' + currency + '"')) {
                throw new Error(file + ': missing display currency ' + currency);
              }
            }
          }
          const landing = fs.readFileSync('landing.js', 'utf8');
          const pricing = fs.readFileSync('pricing.html', 'utf8');
          if (!landing.includes('function checkoutCurrencyFor') || !landing.includes('currency:paymentCurrency')) {
            throw new Error('Homepage must preserve display currency and normalize payment currency by region');
          }
          if (!pricing.includes('function checkoutCurrencyFor') || !pricing.includes('currency:paymentCurrency')) {
            throw new Error('Pricing page must preserve display currency and normalize payment currency by region');
          }
          const signup = fs.readFileSync('signup.html', 'utf8');
          const login = fs.readFileSync('login.html', 'utf8');
          const worker = fs.readFileSync('backend/worker.js', 'utf8');
          const google = fs.readFileSync('auth-google.js', 'utf8');
          const callback = fs.readFileSync('auth-confirmed.js', 'utf8');
          const otpGuide = fs.readFileSync('docs/email-verification-otp.md', 'utf8');
          const migrationGuide = fs.readFileSync('docs/production-d1-migrations.md', 'utf8');
          if (!signup.includes('startResendCooldown') || !signup.includes('resendCooldownUntil')) {
            throw new Error('Signup page must enforce the resend cooldown');
          }
          if (!worker.includes('resend-verification') || !worker.includes('3,900')) {
            throw new Error('Worker resend endpoint must enforce the 3-per-15-minute limit');
          }
          if (!otpGuide.includes('1800 seconds') || !otpGuide.includes('{{ .Token }}')) {
            throw new Error('OTP setup guide must document 30-minute OTP and token template');
          }
          if (!signup.includes('data-google-signin') || !login.includes('data-google-signin') || !google.includes("provider:'google'")) {
            throw new Error('Google sign-in must be available on both account screens');
          }
          if (!worker.includes('oauth-session') || !worker.includes('email-link-session') || !worker.includes('identities.length===0')) {
            throw new Error('Worker must provision Google sessions, email-link sessions and reject duplicate signups clearly');
          }
          if (!callback.includes('exchangeCodeForSession') || !callback.includes('emailLinkSession')) {
            throw new Error('Auth callback must complete Google and email-link sessions');
          }
          if (!migrationGuide.includes('npx wrangler d1 migrations apply tampslat-db --remote')) {
            throw new Error('Production D1 migration instructions must be documented before Worker releases');
          }
          NODE

      - name: Trivy security scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Dependency review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4

  docker-smoke:
    name: Docker build and service smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start service containers
        run: docker compose up --build -d

      - name: Verify services
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8788/health >/dev/null && curl -fsS http://127.0.0.1:8790/health >/dev/null; then
              echo "Both service containers are healthy"
              exit 0
            fi
            sleep 5
          done
          docker compose ps
          docker compose logs --no-color
          exit 1

      - name: Stop containers
        if: always()
        run: docker compose down -v

  minikube-smoke:
    name: Minikube Kubernetes deployment smoke test
    runs-on: ubuntu-latest
    needs: [docker-smoke]
    steps:
      - uses: actions/checkout@v4

      - name: Start Minikube
        uses: medyagh/setup-minikube@v0.0.21
        with:
          driver: docker
          container-runtime: docker

      - name: Build images inside Minikube
        run: |
          eval "$(minikube docker-env)"
          docker build -t tampslat-document-converter:ci ./services/document-converter
          docker build -t tampslat-font-compiler:ci ./services/font-compiler

      - name: Deploy services
        run: |
          kubectl create deployment document-converter --image=tampslat-document-converter:ci --port=8788
          kubectl create deployment font-compiler --image=tampslat-font-compiler:ci --port=8790
          kubectl set env deployment/document-converter PORT=8788 MAX_UPLOAD_BYTES=52428800
          kubectl set env deployment/font-compiler PORT=8790
          kubectl patch deployment document-converter --type=json -p='[{"op":"replace","path":"/spec/template/spec/containers/0/imagePullPolicy","value":"Never"}]'
          kubectl patch deployment font-compiler --type=json -p='[{"op":"replace","path":"/spec/template/spec/containers/0/imagePullPolicy","value":"Never"}]'
          kubectl expose deployment document-converter --port=8788 --target-port=8788
          kubectl expose deployment font-compiler --port=8790 --target-port=8790
          kubectl rollout status deployment/document-converter --timeout=180s
          kubectl rollout status deployment/font-compiler --timeout=180s

      - name: Verify Kubernetes services
        run: |
          kubectl port-forward service/document-converter 18788:8788 >/tmp/document-converter.log 2>&1 &
          kubectl port-forward service/font-compiler 18790:8790 >/tmp/font-compiler.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18788/health >/dev/null && curl -fsS http://127.0.0.1:18790/health >/dev/null; then
              echo "Both Kubernetes services are healthy"
              exit 0
            fi
            sleep 5
          done
          kubectl get pods,services
          kubectl describe pods
          exit 1

      - name: Collect Kubernetes diagnostics
        if: failure()
        run: |
          kubectl get all -o wide || true
          kubectl describe pods || true
          kubectl logs -l app=document-converter --all-containers=true || true
          kubectl logs -l app=font-compiler --all-containers=true || true
