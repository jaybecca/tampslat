<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17264f"><title>Choose a new password · TAMPslat</title><link rel="stylesheet" href="assets/brand-system.css"><link rel="icon" href="/assets/favicon.svg?v=4" type="image/svg+xml"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 15% 15%,#e5d9ff,transparent 28%),linear-gradient(135deg,#f6f8ff,#eef2ff);font-family:Inter,system-ui,sans-serif;color:#17264f}.card{width:min(100%,480px);background:#fff;padding:clamp(28px,5vw,46px);border:1px solid #e3e8f4;border-radius:24px;box-shadow:0 25px 70px #25365b18}.logo{display:block;width:150px;max-width:60%;height:auto;object-fit:contain;margin:0 auto 26px}.card h1{font-size:30px;letter-spacing:-.04em;margin:0 0 10px}.card p{line-height:1.7;color:#687590}.card label{display:block;margin:18px 0 7px;font-size:14px;font-weight:750}.card input{width:100%;height:49px;border:1px solid #dce2ee;border-radius:11px;padding:12px 14px;font:inherit}.primary{width:100%;min-height:50px;margin-top:22px;border:0;border-radius:12px;background:linear-gradient(110deg,#5426d6,#7938df);color:white;font:inherit;font-weight:800;cursor:pointer}.status{display:none;margin-top:14px;padding:12px;border-radius:10px;background:#f3f5fb;color:#586681;font-size:13px;line-height:1.5}.links{text-align:center;margin-top:20px}.links a{color:#5d35d2;font-weight:750;text-decoration:none}</style></head><body><main class="card"><a href="index.html"><img class="logo" src="assets/tampslat-logo-auth.png" alt="TAMPslat"></a><h1>Choose a new password</h1><p>Use at least 10 characters. Once updated, return to sign in with your new password.</p><form id="passwordForm"><label for="password">New password</label><input id="password" type="password" minlength="10" maxlength="128" autocomplete="new-password" required><label for="confirmPassword">Confirm new password</label><input id="confirmPassword" type="password" minlength="10" maxlength="128" autocomplete="new-password" required><button class="primary" type="submit">Update password</button></form><div class="status" id="status" role="status"></div><div class="links"><a href="login.html">Back to sign in</a></div></main><script src="backend-client.js"></script><script>const params=new URLSearchParams(location.hash.replace(/^#/,''));
const accessToken=params.get('access_token'),flowType=params.get('type');
const form=document.getElementById('passwordForm'),status=document.getElementById('status');
if(!accessToken||flowType!=='recovery'){form.hidden=true;status.textContent='This password reset link is invalid or has expired. Request a new reset email.';status.style.display='block';}
form.addEventListener('submit',async event=>{event.preventDefault();const password=document.getElementById('password').value,confirm=document.getElementById('confirmPassword').value,button=form.querySelector('button');if(password!==confirm){status.textContent='The passwords do not match.';status.style.display='block';return;}button.disabled=true;status.textContent='Updating your password securely…';status.style.display='block';try{const result=await window.TAMPSLAT_API.updatePassword(accessToken,password);form.hidden=true;status.textContent=result.message||'Password updated. You can now sign in.';history.replaceState(null,'',location.pathname+location.search);}catch(error){status.textContent=error.message||'The reset link could not be used. Request a new one.';}finally{button.disabled=false;}});
</script></body></html>
