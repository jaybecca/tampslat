services:
  document-converter:
    build: ./services/document-converter
    ports: ["8788:8788"]
    environment:
      PORT: 8788
      MAX_UPLOAD_BYTES: 52428800
      CORS_ORIGINS: http://127.0.0.1:5500,http://localhost:5500,http://127.0.0.1:8000,http://localhost:8000
    restart: unless-stopped
  font-compiler:
    build: ./services/font-compiler
    ports: ["8790:8790"]
    environment:
      PORT: 8790
      CORS_ORIGINS: http://127.0.0.1:5500,http://localhost:5500,http://127.0.0.1:8000,http://localhost:8000
    restart: unless-stopped
