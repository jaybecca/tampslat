<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forgot password · TAMPslat</title><link rel="icon" href="assets/favicon.svg"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 15% 15%,#e5d9ff,transparent 28%),linear-gradient(135deg,#f6f8ff,#eef2ff);font-family:Inter,system-ui,sans-serif;color:#17264f}.card{width:min(100%,470px);background:#fff;padding:clamp(26px,5vw,44px);border:1px solid #e3e8f4;border-radius:24px;box-shadow:0 25px 70px #25365b18}.logo{display:block;width:112px;max-width:46%;height:auto;object-fit:contain;margin:0 auto 22px;background:transparent;border-radius:0;padding:0}.card h1{font-size:32px;letter-spacing:-.04em;margin:0 0 10px}.card p{line-height:1.7;color:#687590}.card label{display:block;margin:18px 0 7px;font-size:14px;font-weight:750}.field{display:flex;gap:8px}.field input{flex:1;min-width:0}.card input{width:100%;height:49px;border:1px solid #dce2ee;border-radius:11px;padding:12px 14px;font:inherit}.toggle{border:1px solid #dce2ee;background:#f7f7fc;border-radius:11px;padding:0 12px;color:#5d35d2;font-weight:750;cursor:pointer}.primary{width:100%;margin-top:22px;min-height:50px;border:0;border-radius:12px;background:linear-gradient(110deg,#5426d6,#7938df);color:white;font:inherit;font-weight:800;cursor:pointer}.notice{padding:12px;border-radius:10px;background:#f3f5fb;color:#586681;font-size:13px}.links{text-align:center;margin-top:20px}.links a{color:#5d35d2;font-weight:750;text-decoration:none}.status{display:none;margin-top:12px;padding:12px;background:#f3f5fb;border-radius:10px;font-size:13px;line-height:1.5}

</style><link rel="stylesheet" href="assets/brand-system.css"></head><body><main class="card"><a href="index.html"><img class="logo" src="assets/tampslat-logo-auth.png" alt="TAMPslat — Digital and Ready"></a><h1>Reset your password</h1><p>Enter your account email to start a password reset.</p><div class="notice">Password reset email delivery will work after authentication and email services are configured.</div><form id="resetForm"><label for="email">Email address</label><input id="email" type="email" autocomplete="email" placeholder="you@example.com" required><button class="primary">Send reset instructions</button><div class="status" id="status" role="status"></div></form><div class="links"><a href="login.html">Back to sign in</a> · <a href="support.html">Support</a></div></main><script>document.getElementById('resetForm').addEventListener('submit',e=>{e.preventDefault();const s=document.getElementById('status');s.textContent='Frontend preview only: no reset email was sent. Connect the authentication backend to activate password recovery.';s.style.display='block'});</script><script src="auth-language.js"></script></body></html>
