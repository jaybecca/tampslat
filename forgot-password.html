<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forgot password · TAMPslat</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 15% 15%,#e5d9ff,transparent 28%),linear-gradient(135deg,#f6f8ff,#eef2ff);font-family:Inter,system-ui,sans-serif;color:#17264f}.card{width:min(100%,470px);background:#fff;padding:clamp(26px,5vw,44px);border:1px solid #e3e8f4;border-radius:24px;box-shadow:0 25px 70px #25365b18}.logo{display:block;width:112px;max-width:46%;height:auto;object-fit:contain;margin:0 auto 22px;background:transparent;border-radius:0;padding:0}.card h1{font-size:32px;letter-spacing:-.04em;margin:0 0 10px}.card p{line-height:1.7;color:#687590}.card label{display:block;margin:18px 0 7px;font-size:14px;font-weight:750}.field{display:flex;gap:8px}.field input{flex:1;min-width:0}.card input{width:100%;height:49px;border:1px solid #dce2ee;border-radius:11px;padding:12px 14px;font:inherit}.toggle{border:1px solid #dce2ee;background:#f7f7fc;border-radius:11px;padding:0 12px;color:#5d35d2;font-weight:750;cursor:pointer}.primary{width:100%;margin-top:22px;min-height:50px;border:0;border-radius:12px;background:linear-gradient(110deg,#5426d6,#7938df);color:white;font:inherit;font-weight:800;cursor:pointer}.notice{padding:12px;border-radius:10px;background:#f3f5fb;color:#586681;font-size:13px}.links{text-align:center;margin-top:20px}.links a{color:#5d35d2;font-weight:750;text-decoration:none}.status{display:none;margin-top:12px;padding:12px;background:#f3f5fb;border-radius:10px;font-size:13px;line-height:1.5}
