<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Confirming your payment | TAMPslat</title><link rel="stylesheet" href="assets/brand-system.css"><link rel="stylesheet" href="assets/upgrade.css"></head><body class="upgrade-page"><main class="payment-return"><img src="assets/tampslat-logo.png" alt="TAMPslat"><h1>Confirming your payment</h1><p id="paymentMessage">We are checking your transaction securely with Flutterwave. Please keep this page open.</p><a class="up-btn" href="tools.html">Continue to workspace</a><a href="support.html">Contact support</a></main><script src="backend-client.js"></script><script>(async()=>{const q=new URLSearchParams(location.search),id=q.get('transaction_id'),status=document.querySelector('#paymentMessage');if(!id){status.textContent='No transaction reference was returned. If you completed payment, contact support with your Flutterwave receipt.';return}try{const d=await window.TAMPSLAT_API.request('/billing/verify?transaction_id='+encodeURIComponent(id),{headers:{}});status.textContent=d.kind==='credits'?'Payment verified. '+d.credits+' AI credits have been added to your account.':'Payment verified. Your '+d.plan+' plan is active for 30 days.'}catch(e){status.textContent=e.message||'We could not verify this payment yet. Do not pay again until you check your Flutterwave receipt or contact support.'}})();</script><script src="assets/upgrade-theme.js"></script></body></html>
