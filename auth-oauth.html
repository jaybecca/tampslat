<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#17264f"><title>Signing in · TAMPslat</title>
<link rel="stylesheet" href="assets/brand-system.css">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 15% 15%,#e5d9ff,transparent 28%),linear-gradient(135deg,#f6f8ff,#eef2ff);font-family:Inter,system-ui,sans-serif;color:#17264f}.card{width:min(100%,460px);background:#fff;padding:clamp(28px,5vw,44px);border:1px solid #e3e8f4;border-radius:24px;box-shadow:0 25px 70px #25365b18;text-align:center}.logo{width:150px;max-width:60%;height:auto;object-fit:contain;margin:0 auto 24px}.spinner{width:38px;height:38px;margin:0 auto 18px;border:4px solid #e8e3fb;border-top-color:#6844db;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}h1{font-size:26px;margin:0 0 10px}p{line-height:1.7;color:#687590}.error{padding:12px 14px;border-radius:12px;background:#fff0f0;color:#a12b38;font-size:13px}.link{display:inline-flex;justify-content:center;align-items:center;min-height:46px;padding:0 22px;margin-top:12px;border-radius:11px;background:#6544e8;color:#fff;text-decoration:none;font-weight:800}
</style>
</head>
<body><main class="card"><img class="logo" src="assets/tampslat-logo-auth.png" alt="TAMPslat"><div class="spinner" id="spinner" aria-hidden="true"></div><h1 id="title">Completing Google sign-in</h1><p id="message" role="status" aria-live="polite">Verifying your Google account securely…</p><a class="link" id="back" href="login.html" hidden>Return to sign in</a></main>
<script src="backend-client.js"></script>
<script>
(async()=>{
 const title=document.getElementById('title'),message=document.getElementById('message'),spinner=document.getElementById('spinner'),back=document.getElementById('back');
 const params=new URLSearchParams(location.search),fragment=new URLSearchParams(location.hash.replace(/^#/,''));
 const nextRaw=params.get('next')||'tools.html';
 const allowed=/^(tools\.html|index\.html|studios\.html|template-library\.html|font-studio\.html|presentation-studio\.html|3d-web-studio\.html|document-converter\.html|ebook-studio\.html|ai-studio\.html|batch-studio\.html|business-operations-studio\.html|design-studio\.html|document-studio\.html|file-studio\.html|pdf-studio\.html|spreadsheet-studio\.html|vault-studio\.html|zip-studio\.html|vault\.html|sheets\.html)(#.*)?$/.test(nextRaw)?nextRaw:'tools.html';
 try{
  const providerError=params.get('error_description')||params.get('error')||fragment.get('error_description')||fragment.get('error');
  if(providerError)throw new Error(providerError.replace(/\+/g,' '));
  const accessToken=fragment.get('access_token');
  if(!accessToken)throw new Error('Google did not return a sign-in session. Please try again or use email sign-in.');
  history.replaceState(null,'',location.pathname+location.search);
  await window.TAMPSLAT_API.oauth(accessToken);
  const session=await window.TAMPSLAT_API.me();
  if(!session?.user)throw new Error('Google sign-in was accepted, but your TAMPslat session could not be confirmed. Please sign in again.');
  location.replace(allowed);
 }catch(error){
  spinner.hidden=true;title.textContent='Google sign-in could not be completed';message.className='error';message.textContent=error.message||'Please return to sign in and try again.';back.hidden=false;
 }
})();
</script>
</body></html>
