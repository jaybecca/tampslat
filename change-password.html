<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Change password · TAMPslat</title><link rel="icon" href="assets/favicon.svg"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 15% 15%,#e5d9ff,transparent 28%),linear-gradient(135deg,#f6f8ff,#eef2ff);font-family:Inter,system-ui,sans-serif;color:#17264f}.card{width:min(100%,470px);background:#fff;padding:clamp(26px,5vw,44px);border:1px solid #e3e8f4;border-radius:24px;box-shadow:0 25px 70px #25365b18}.logo{display:block;width:112px;max-width:46%;height:auto;object-fit:contain;margin:0 auto 22px;background:transparent;border-radius:0;padding:0}.card h1{font-size:32px;letter-spacing:-.04em;margin:0 0 10px}.card p{line-height:1.7;color:#687590}.card label{display:block;margin:18px 0 7px;font-size:14px;font-weight:750}.field{display:flex;gap:8px}.field input{flex:1;min-width:0}.card input{width:100%;height:49px;border:1px solid #dce2ee;border-radius:11px;padding:12px 14px;font:inherit}.toggle{border:1px solid #dce2ee;background:#f7f7fc;border-radius:11px;padding:0 12px;color:#5d35d2;font-weight:750;cursor:pointer}.primary{width:100%;margin-top:22px;min-height:50px;border:0;border-radius:12px;background:linear-gradient(110deg,#5426d6,#7938df);color:white;font:inherit;font-weight:800;cursor:pointer}.notice{padding:12px;border-radius:10px;background:#f3f5fb;color:#586681;font-size:13px}.links{text-align:center;margin-top:20px}.links a{color:#5d35d2;font-weight:750;text-decoration:none}.status{display:none;margin-top:12px;padding:12px;background:#f3f5fb;border-radius:10px;font-size:13px;line-height:1.5}
/* Premium typography system: slightly stronger body copy and confident interface hierarchy. */
body{font-weight:500;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}button,input,select,textarea{font-weight:600}label,.label,.nav-item,.tab,.chip{font-weight:650}h1,h2,h3,h4,h5,h6{font-weight:750;letter-spacing:-.018em}strong,b{font-weight:800}
</style><link rel="stylesheet" href="assets/brand-system.css"></head><body><main class="card"><a href="index.html"><img class="logo" src="assets/tampslat-logo-auth.png" alt="TAMPslat — Digital and Ready"></a><h1>Change password</h1><p>Choose a strong password you have not used elsewhere.</p><form id="changeForm"><label for="current">Current password</label><div class="field"><input id="current" type="password" autocomplete="current-password" required><button class="toggle" type="button" data-toggle="current">Show</button></div><label for="next">New password</label><div class="field"><input id="next" type="password" autocomplete="new-password" minlength="12" required><button class="toggle" type="button" data-toggle="next">Show</button></div><label for="confirm">Confirm new password</label><div class="field"><input id="confirm" type="password" autocomplete="new-password" minlength="12" required><button class="toggle" type="button" data-toggle="confirm">Show</button></div><button class="primary">Update password</button><div class="status" id="status" role="status"></div></form><div class="links"><a href="settings.html">Back to settings</a> · <a href="support.html">Support</a></div></main><script>document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>{let i=document.getElementById(b.dataset.toggle);i.type=i.type==='password'?'text':'password';b.textContent=i.type==='password'?'Show':'Hide'});document.getElementById('changeForm').onsubmit=e=>{e.preventDefault();let s=document.getElementById('status');if(document.getElementById('next').value!==document.getElementById('confirm').value){s.textContent='The new passwords do not match.'}else{s.textContent='Frontend preview only: password changes require an authenticated backend.'}s.style.display='block'};</script><script src="auth-language.js"></script></body></html>
