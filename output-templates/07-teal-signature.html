const titleInput=document.getElementById('titleInput'),paste=document.getElementById('paste'),outTitle=document.getElementById('outTitle'),outContent=document.getElementById('outContent');function applyContent(){outTitle.textContent=titleInput.value.trim()||'Your document title';outContent.textContent=paste.value;}titleInput.addEventListener('input',applyContent);document.getElementById('apply').onclick=applyContent;document.getElementById('print').onclick=()=>{applyContent();window.print()};document.getElementById('download').onclick=()=>{applyContent();const doc='<!doctype html><meta charset="utf-8"><title>'+outTitle.textContent.replace(/[&<>"]/g,'')+'</title><style>body{font:15px/1.7 Arial;color:#123e43;margin:35px}header{padding:30px;background:#eafafa;border-top:10px solid #078c91}h1{font-size:30px}article{white-space:pre-wrap;overflow-wrap:anywhere;padding:30px 0;min-height:500px}footer{border-top:1px solid #ddd;padding-top:15px;color:#777;font-size:11px}</style><header><small style="color:#078c91">TAMPslat · Teal Signature</small><h1>'+outTitle.textContent+'</h1></header><article>'+outContent.textContent.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')+'</article><footer>Prepared with TAMPslat · Review details before sharing</footer>';const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([doc],{type:'text/html;charset=utf-8'}));a.download='tampslat-output-template.html';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};applyContent();
</script></body></html>
