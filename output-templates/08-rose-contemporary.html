<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rose Contemporary · TAMPslat Output Template</title>
<style>
:root{--paper:#fff0f5;--ink:#542337;--accent:#c43d70}*{box-sizing:border-box}body{margin:0;background:#eef0f6;color:var(--ink);font:15px/1.7 Inter,Arial,sans-serif}.toolbar{position:sticky;top:0;background:#fff;padding:14px 18px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;box-shadow:0 2px 16px #10172b12;z-index:3}button{border:0;border-radius:9px;padding:11px 15px;font-weight:750;cursor:pointer;background:var(--accent);color:white}button.secondary{background:#f2f3f8;color:#283047;border:1px solid #e0e3ed}.toolbar span{font-size:12px;color:#737b8b;margin-right:auto}.sheet{width:min(900px,calc(100% - 32px));min-height:1050px;margin:30px auto;background:white;box-shadow:0 20px 65px #10172b18;border-radius:16px;overflow:hidden}.banner{padding:36px 48px;background:var(--paper);border-top:12px solid var(--accent);position:relative}.banner:after{content:'';position:absolute;right:32px;top:28px;width:60px;height:60px;border:2px solid var(--accent);border-radius:18px;opacity:.28;transform:rotate(12deg)}.kicker{font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-weight:800;color:var(--accent)}h1{font-size:30px;line-height:1.2;margin:8px 80px 0 0;overflow-wrap:anywhere}.editor{padding:26px 48px 0}label{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.1em;font-weight:800;color:var(--accent);margin-bottom:6px}input,textarea{width:100%;font:inherit;border:1px solid #e0e3ed;border-radius:10px;padding:12px;color:#202537;background:#fff}textarea{min-height:160px;resize:vertical;line-height:1.6}.body{padding:28px 48px 55px;white-space:pre-wrap;overflow-wrap:anywhere;min-height:500px}.body:empty:before{content:'Your pasted content will appear here.';color:#a0a6b4;font-style:italic}.footer{border-top:1px solid #e7e8ef;margin:0 48px;padding:16px 0 28px;color:#7b8190;font-size:11px;letter-spacing:.08em;text-transform:uppercase}@media(max-width:600px){.sheet{width:100%;margin:0;border-radius:0;min-height:100vh}.banner{padding:28px 24px}.editor,.body{padding-left:24px;padding-right:24px}.footer{margin:0 24px}h1{font-size:25px}}@media print{body{background:white}.toolbar,.editor{display:none}.sheet{width:100%;margin:0;box-shadow:none;border-radius:0;min-height:0}.banner{break-after:avoid}.body{min-height:0}.footer{break-inside:avoid}@page{size:A4;margin:12mm}}
</style></head><body><div class="toolbar"><span>TAMPslat · Blank output design</span><button class="secondary" id="apply">Apply pasted content</button><button id="download">Download HTML</button><button class="secondary" id="print">Print / Save as PDF</button></div><main class="sheet"><header class="banner"><div class="kicker">TAMPslat · Rose Contemporary</div><h1 id="outTitle">Your document title</h1></header><section class="editor"><label for="titleInput">Document title</label><input id="titleInput" placeholder="Enter a document title"><label for="paste" style="margin-top:14px">Paste your generated output</label><textarea id="paste" placeholder="Paste your completed CV, cover letter, proposal, report or other business output here…"></textarea></section><article class="body" id="outContent"></article><footer class="footer">Prepared with TAMPslat · Review details before sharing</footer></main><script>
const titleInput=document.getElementById('titleInput'),paste=document.getElementById('paste'),outTitle=document.getElementById('outTitle'),outContent=document.getElementById('outContent');function applyContent(){outTitle.textContent=titleInput.value.trim()||'Your document title';outContent.textContent=paste.value;}titleInput.addEventListener('input',applyContent);document.getElementById('apply').onclick=applyContent;document.getElementById('print').onclick=()=>{applyContent();window.print()};document.getElementById('download').onclick=()=>{applyContent();const doc='<!doctype html><meta charset="utf-8"><title>'+outTitle.textContent.replace(/[&<>"]/g,'')+'</title><style>body{font:15px/1.7 Arial;color:#542337;margin:35px}header{padding:30px;background:#fff0f5;border-top:10px solid #c43d70}h1{font-size:30px}article{white-space:pre-wrap;overflow-wrap:anywhere;padding:30px 0;min-height:500px}footer{border-top:1px solid #ddd;padding-top:15px;color:#777;font-size:11px}</style><header><small style="color:#c43d70">TAMPslat · Rose Contemporary</small><h1>'+outTitle.textContent+'</h1></header><article>'+outContent.textContent.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')+'</article><footer>Prepared with TAMPslat · Review details before sharing</footer>';const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([doc],{type:'text/html;charset=utf-8'}));a.download='tampslat-output-template.html';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};applyContent();
</script></body></html>
