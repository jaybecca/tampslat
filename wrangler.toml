name = "tampslat-api"
main = "backend/worker.js"
compatibility_date = "2026-10-28"
workers_dev = true

[vars]
APP_ORIGIN = "https://YOUR-TAMPSLAT-DOMAIN.example"
AI_PROVIDER = "openai"
AI_MODEL = "gpt-4.1-mini"
FREE_AI_CREDITS = "5"
AI_CREDIT_COST = "1"
MAX_AI_INPUT_CHARS = "12000"
MAX_OCR_BYTES = "5000000"

[[d1_databases]]
binding = "DB"
database_name = "tampslat-db"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "backend/migrations"

[[r2_buckets]]
binding = "FILES"
bucket_name = "tampslat-files"

[assets]
directory = "."
run_worker_first = ["/api/*"]

[secrets]
required = ["OPENAI_API_KEY"]