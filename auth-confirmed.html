<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17264f">
<title>Finishing sign-in · TAMPslat</title><link rel="stylesheet" href="assets/brand-system.css"><link rel="icon" href="/assets/favicon.svg?v=4" type="image/svg+xml">
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 15% 15%,#e5d9ff,transparent 28%),linear-gradient(135deg,#f6f8ff,#eef2ff);font-family:Inter,system-ui,sans-serif;color:#17264f}.card{width:min(100%,480px);background:#fff;padding:clamp(28px,5vw,46px);border:1px solid #e3e8f4;border-radius:24px;box-shadow:0 25px 70px #25365b18;text-align:center}.logo{width:150px;max-width:60%;height:auto;object-fit:contain;margin:0 auto 26px}.mark{width:58px;height:58px;margin:0 auto 18px;border-radius:18px;display:grid;place-items:center;background:#e8f8f0;color:#16834e;font-size:30px;font-weight:900}.card h1{font-size:30px;letter-spacing:-.04em;margin:0 0 10px}.card p{line-height:1.7;color:#687590}.primary{display:inline-flex;justify-content:center;align-items:center;min-height:49px;padding:0 24px;margin-top:18px;border-radius:12px;background:linear-gradient(110deg,#5426d6,#7938df);color:#fff;text-decoration:none;font-weight:800}.error{background:#fff0f0;color:#a12b38;padding:12px;border-radius:10px}</style>
</head>
<body><main class="card"><img class="logo" src="assets/tampslat-logo-auth.png" alt="TAMPslat"><div class="mark" aria-hidden="true">✓</div><h1 id="authTitle">Email verified</h1><p id="authMessage">Your email has been confirmed. Preparing your TAMPslat workspace…</p><a class="primary" id="authAction" href="login.html">Continue to sign in</a></main>
<script src="backend-client.js"></script>
<script>
(async function(){
 const title=document.getElementById('authTitle'),message=document.getElementById('authMessage'),action=document.getElementById('authAction');
 const params=new URLSearchParams(location.hash.replace(/^#/,''));
 const accessToken=params.get('access_token');
 const error=params.get('error_description')||params.get('error')||new URLSearchParams(location.search).get('error_description')||new URLSearchParams(location.search).get('error');
 if(error){title.textContent='Sign-in could not be completed';message.className='error';message.textContent=error;action.textContent='Back to sign in';return;}
 if(!accessToken){message.textContent='If you just confirmed your email, you can now sign in. If you selected Google, please try again or check that Google sign-in is enabled.';return;}
 history.replaceState(null,document.title,location.pathname+location.search);
 title.textContent='Finishing sign-in';message.textContent='Your identity is confirmed. Setting up your secure workspace…';action.hidden=true;
 try{
   await window.TAMPSLAT_API.completeAuthSession(accessToken);
   title.textContent='You’re signed in';message.textContent='Your TAMPslat workspace is ready.';location.replace('tools.html');
 }catch(err){title.textContent='We could not finish sign-in';message.className='error';message.textContent=err.message||'Please return to sign in and try again.';action.hidden=false;action.textContent='Return to sign in';}
})();
</script></body></html>
